# infra/aws/nginx/default.conf
# Container web (T095): phuc vu ban build tinh cua Vite va chuyen /api/ nguyen trang toi inference-api.
# CloudFront dat cache cho default behavior va tat cache cho /api/*; origin nay khong cache response API.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Lon hon gioi han body cua API (10 MiB + 64 KiB) de API tu tra 413 CLIP_TOO_LARGE dung envelope;
    # body lon hon nua bi nginx chan ngay tu Content-Length
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # API tu dat security header, X-Request-ID va ma loi; nginx khong them header de tranh trung lap
        proxy_pass http://inference-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # Lon hon timeout 15 s cua FE cho du doan
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        # Ten file Vite co hash noi dung nen cache lau duoc
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
