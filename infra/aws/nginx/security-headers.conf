# infra/aws/nginx/security-headers.conf
# Security header cho trang web tinh (T092/T095): chi tai tai nguyen cung origin, chi xin camera, khong cho nhung
# khung. HSTS dat o CloudFront (T096) vi origin nay chi nhan HTTP tu CloudFront.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
