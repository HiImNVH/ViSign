# ai/pyproject.toml
# Khai bao goi visign_ai va dependency cho pipeline MediaPipe, training va evaluation.

[project]
name = "visign-ai"
version = "0.0.1"
description = "Offline landmark extraction, GRU training and evaluation for ViSign"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==19.0.2",
    "mediapipe==1.1.1",
    "numpy==2.5.4",
    "opencv-contrib-python==5.0.0.93",
    "torch==2.11.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Theo doi thi nghiem tren Weights & Biases; train van chay khi khong cai (khoa `wandb` trong config bi bo qua)
tracking = ["wandb==0.31.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visign_ai"]
