# services/inference-api/pyproject.toml
# Khai bao goi visign_api va dependency groups cho dich vu suy luan FastAPI.

[project]
name = "visign-api"
version = "0.0.1"
description = "FastAPI inference service for ViSign Vietnamese Sign Language Recognition MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visign_api"]
