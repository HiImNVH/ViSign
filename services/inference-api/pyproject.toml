# services/inference-api/pyproject.toml
# Khai bao goi visign_api va dependency groups cho dich vu suy luan FastAPI.

[project]
name = "visign-api"
version = "0.0.1"
description = "FastAPI inference service for ViSign Vietnamese Sign Language Recognition MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "numpy>=2.5",
]

[project.optional-dependencies]
# May phuc vu that cai them pipeline chung cua P3: uv sync --project services/inference-api --extra serving
# torch khai bao truc tiep (cung phien ban visign-ai) de image Linux lay ban CPU, khong keo bo CUDA (T095)
serving = ["visign-ai", "torch==2.11.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "mypy",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261103",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visign_api"]

[tool.uv.sources]
visign-ai = { path = "../../ai", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
